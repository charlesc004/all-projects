name: AVENOR quality
on: [push, pull_request]
jobs:
  wordpress:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-ci-password
          MYSQL_DATABASE: avenor_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -plocal-ci-password" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, gd, dom, xml, zip
          tools: composer, wp-cli
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist
      - run: npm run build && npm run lint:js && npm run check:architecture && npm run test:php
      - run: composer lint
      - name: Install disposable MySQL WordPress
        run: |
          mkdir -p /tmp/avenor-wp
          wp core download --path=/tmp/avenor-wp
          wp config create --path=/tmp/avenor-wp --dbname=avenor_test --dbuser=root --dbpass=local-ci-password --dbhost=127.0.0.1
          wp core install --path=/tmp/avenor-wp --url=http://127.0.0.1:9400 --title=AVENOR --admin_user=admin --admin_password=password --admin_email=admin@example.test --skip-email
          ln -s "$GITHUB_WORKSPACE/web/wp-content/plugins/avenor-core" /tmp/avenor-wp/wp-content/plugins/avenor-core
          ln -s "$GITHUB_WORKSPACE/web/wp-content/themes/avenor" /tmp/avenor-wp/wp-content/themes/avenor
          wp plugin activate avenor-core --path=/tmp/avenor-wp
          wp theme activate avenor --path=/tmp/avenor-wp
      - run: composer test
        env:
          AVENOR_TEST_WP_ROOT: /tmp/avenor-wp
      - name: Seed and serve
        run: |
          wp eval-file "$GITHUB_WORKSPACE/tools/seed.php" --path=/tmp/avenor-wp
          wp rewrite flush --path=/tmp/avenor-wp
          wp server --path=/tmp/avenor-wp --host=127.0.0.1 --port=9400 > /tmp/avenor-server.log 2>&1 &
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            playwright-report
            artifacts/visual-review
