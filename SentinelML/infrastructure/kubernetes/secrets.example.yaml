# Supply actual values using an external secret manager or kubectl create secret --from-env-file.
# This example is documentation and is not applied automatically.
apiVersion: v1
kind: Secret
metadata: {name: ingestion-secrets, namespace: sentinelml}
type: Opaque
stringData:
  DATABASE_URL: postgres://ingestion:REPLACE@postgres/sentinel_ingestion
  INTERNAL_SERVICE_TOKEN: REPLACE_WITH_RANDOM_SHARED_INTERNAL_TOKEN
---
apiVersion: v1
kind: Secret
metadata: {name: inference-secrets, namespace: sentinelml}
type: Opaque
stringData:
  DATABASE_URL: postgres://inference:REPLACE@postgres/sentinel_inference
  INTERNAL_SERVICE_TOKEN: REPLACE_WITH_THE_SAME_INTERNAL_TOKEN
---
apiVersion: v1
kind: Secret
metadata: {name: control-secrets, namespace: sentinelml}
type: Opaque
stringData:
  DATABASE_URL: postgres://control:REPLACE@postgres/sentinel_control
  SECRET_KEY_BASE: REPLACE_WITH_RANDOM_SESSION_ENCRYPTION_SECRET
  INTERNAL_SERVICE_TOKEN: REPLACE_WITH_THE_SAME_INTERNAL_TOKEN
