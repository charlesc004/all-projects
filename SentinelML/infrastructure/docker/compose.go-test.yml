name: sentinelml-go-tests
services:
  postgres:
    image: postgres:17-bookworm
    environment: {POSTGRES_PASSWORD: sentinel-go-test-only, POSTGRES_DB: ingestion_test}
    healthcheck: {test: [CMD-SHELL, "pg_isready -U postgres"], interval: 2s, timeout: 3s, retries: 30}
  redis:
    image: redis:7.4-bookworm
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 3s, retries: 30}
  tests:
    image: sentinelml-ingestion-test-runner:latest
    environment:
      DATABASE_URL: postgres://postgres:sentinel-go-test-only@postgres/ingestion_test
      TEST_DATABASE_URL: postgres://postgres:sentinel-go-test-only@postgres/ingestion_test
      TEST_REDIS_ADDR: redis:6379
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
