services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Copy .env.example to .env}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    environment: &wordpress-environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: "define('DISALLOW_FILE_EDIT', true);"
    volumes: &wordpress-volumes
      - wordpress:/var/www/html
      - ./web/wp-content/themes/avenor:/var/www/html/wp-content/themes/avenor
      - ./web/wp-content/plugins/avenor-core:/var/www/html/wp-content/plugins/avenor-core
      - ./tools:/var/www/html/avenor-tools:ro
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      <<: *wordpress-environment
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WORDPRESS_PORT: ${WORDPRESS_PORT:-8080}
    volumes: *wordpress-volumes
    entrypoint: ["wp"]
volumes:
  database:
  wordpress:
