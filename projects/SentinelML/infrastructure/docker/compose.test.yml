name: sentinelml-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: sentinel-test-only
      POSTGRES_DB: sentinel_test
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  rails:
    image: sentinelml-control:latest
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:sentinel-test-only@postgres/sentinel_test
      REDIS_URL: redis://redis:6379/1
      KAFKA_BROKERS: redpanda:9092
      SECRET_KEY_BASE: test-only-secret-key-base-0000000000000000000000000000000000000000
      INTERNAL_SERVICE_TOKEN: test-only-service-token-000000000000000000000000
      CONTRACTS_DIR: /contracts
      MODEL_DIR: /artifacts/v1
    volumes:
      - ../../services/control-plane:/app
      - ../../contracts:/contracts:ro
      - ../../ml/artifacts:/artifacts:ro
    command: [bash, -lc, "bundle exec rails db:migrate && bundle exec rspec"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
