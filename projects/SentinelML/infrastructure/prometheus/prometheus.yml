global:
  scrape_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ingestion
    static_configs: [{targets: ["ingestion:8081"]}]
  - job_name: inference
    static_configs: [{targets: ["inference:8082"]}]
  - job_name: control
    static_configs: [{targets: ["control:3001"]}]
