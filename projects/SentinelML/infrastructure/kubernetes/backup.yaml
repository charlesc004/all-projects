apiVersion: batch/v1
kind: CronJob
metadata: {name: database-backup, namespace: sentinelml}
spec:
  schedule: "15 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata: {labels: {app: database-backup, part-of: sentinelml}}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {fsGroup: 999}
          containers:
            - name: backup
              image: postgres:17-bookworm
              securityContext: {runAsNonRoot: true, runAsUser: 999, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              envFrom: [{secretRef: {name: backup-secrets}}]
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
              command:
                - /bin/sh
                - -ec
                - |
                  umask 077
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  for database in sentinel_control sentinel_ingestion sentinel_inference; do
                    file="/backups/${database}_${stamp}.dump"
                    pg_dump --format=custom --no-owner --dbname="$database" > "$file"
                    test -s "$file"
                    pg_restore --list "$file" > /dev/null
                  done
              volumeMounts: [{name: backups, mountPath: /backups}]
          volumes: [{name: backups, persistentVolumeClaim: {claimName: sentinel-backups}}]
