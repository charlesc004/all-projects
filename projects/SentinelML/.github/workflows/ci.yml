name: SentinelML verification
on: [push, pull_request]
jobs:
  contracts-and-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r ml/requirements.lock.txt ruff==0.17.3 pip-audit==2.10.1
      - run: ruff check ml scripts contracts --select E4,E7,E9,F && ruff format --check ml scripts contracts
      - run: python -m pytest ml/tests contracts -q
      - run: python -m pip_audit -r ml/requirements.lock.txt
  ingestion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: ingestion_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:test@localhost/ingestion_test
      TEST_DATABASE_URL: postgres://postgres:test@localhost/ingestion_test
      TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.27.3"}
      - working-directory: services/ingestion
        run: go mod download && test -z "$(gofmt -l .)" && go vet ./... && go test -race ./...
      - working-directory: services/ingestion
        run: go run ./cmd/api migrate && go test -race -tags integration ./...
      - working-directory: services/ingestion
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -f services/inference/Dockerfile -t sentinelml-inference-test-runner .
      - run: docker compose -f infrastructure/docker/compose.rust-test.yml up --abort-on-container-exit --exit-code-from tests
  control:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: sentinel_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:test@localhost/sentinel_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY_BASE: ci-only-secret-key-base-with-no-production-use-000000000000000000
      RAILS_ENV: test
      KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: "3.3", working-directory: services/control-plane, bundler-cache: true}
      - working-directory: services/control-plane
        run: bundle exec rails db:migrate && bundle exec rspec
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - working-directory: frontend
        run: npm ci && npm run lint && npm run typecheck && npm test && npm run build && npm audit --audit-level=moderate
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose build
      - run: docker compose up -d && docker compose exec -T control bundle exec rails db:seed
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/verify_pipeline.py
      - run: python scripts/demo_traffic.py --count 100 --interval 0.01 && python scripts/verify_operations.py
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e -- --workers=1
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: integration-evidence, path: "compose.log\nfrontend/test-results\ndocs/screenshots"}
      - uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: fs, scan-ref: ., severity: "CRITICAL,HIGH", exit-code: "1"}
